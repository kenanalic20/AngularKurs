  <h1>Product from api</h1>
<div class="card" style="width: 18rem;" *ngIf="httpProduct">
    <img [src]="httpProduct.images[0]" class="card-img-top" alt="...">
    <div class="card-body">
        <div class="card-title">{{httpProduct.title}}</div>
        <div class="card-text">{{httpProduct.description}}</div>
        <div class="card-text">{{httpProduct.brand}}</div>
    </div>
  </div>
