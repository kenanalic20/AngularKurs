<!-- Zadatak 1: Live prikaz unosa.  Napraviti input polje. 
 Korisnik dok kuca tekst prikazuje se njegova vrijednost ispod u paragrafu, 
 ispod prikazati i broj karaktera koji je unio. -->

 <h2>Live input</h2>
 <input type="text" (input)="onInput($event)">
<p>{{liveInput}}</p>
<p>{{liveInput.length}}</p>
<!-- Zadatak 2: Mijenjanje boje preko miša (mouseover / mouseleave). 
 Napraviti div koji: mijenja boju u plavu kada korisnik pređe mišem (mouseenter), 
 vraća boju na sivu kada izađe (mouseleave). -->
 <div class="coloredDiv" [style.backgroundColor]="bgColor" (mouseleave)="onMouseLeave()" (mouseenter)="onMouseEnter()"></div>

<!-- Zadatak 3: Lista proizvoda (ngFor + currency pipe)
Napraviti listu proizvoda. U HTML-u prikazati tabelu proizvoda: ime proizvoda, 
cijenu formatiranu currency:'EUR', red koji je skuplji od 1000 EUR treba biti crvene boje.  -->

<table>
    <thead>
      <th>Slika</th>
      <th>Kod</th>
      <th>Naziv</th>
      <th>Datum</th>
      <th>Cjena</th>
      <th>Kolicina</th>
      <th>Popust</th>
      <th>Opis</th>
    </thead>
    <tbody>
      <tr [style.backgroundColor]="product.price>1000?rowColor:''" *ngFor="let product of products">
        <td><img width="80" height="80" [src]="product.image" alt=""></td>
        <td>{{product.code}}</td>
        <td>{{product.name}}</td>
        <td>{{product.price | currency:'EUR'}}</td>
        <td>{{product.quantity}}</td>
        <td>
          <button>
            {{product.discount ? "Da" : "Ne"}}
          </button>
        </td>
  
        <td>
        {{ product?.description }}
      </td>
      
        
      </tr>
    </tbody>
  </table>

<!-- Zadatak 4: Računanje u realnom vremenu. Napraviti dva input polja tipa number. 
 Svaki put kada korisnik unese broj, sabrati vrijednosti, 
 ispod prikazati rezultat formatiran sa 2 decimale.  -->
<div class="calc">
    <h1>Calculator</h1>
    <div class="numInput">
        <input type="number" (input)="onInput($eve)"><input type="number">
    </div>
</div>


<!-- Zadatak 5: Lista korisnika s filtriranjem. Napraviti listu korisnika (10 imena). 
 Dodati input za filtriranje: na svaki keyup filtrirati listu korisnika koji sadrže uneseni tekst, 
 prikazivati prva 3 rezultata pomoću slice:0:3.  -->
